<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>간단한 게시판</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 40px;
          background: #f5f5f5;
        }

        h1 {
          text-align: center;
          color: #333;
        }

        .board-form {
          background: white;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 0 8px rgba(0,0,0,0.1);
          margin-bottom: 30px;
          max-width: 520px;
          margin-left: auto;
          margin-right: auto;
        }

        input, textarea {
          width: 95%;
          margin-top: 10px;
          margin-bottom: 20px;
          padding: 10px;
          border-radius: 5px;
          border: 1px solid #ccc;
          font-size: 16px;
        }

        button {
          background-color: #4682b4;
          color: white;
          padding: 10px 20px;
          border: none;
          border-radius: 5px;
          font-size: 16px;
          cursor: pointer;
        }

        .post {
          background: white;
          margin: 10px auto;
          padding: 15px;
          border-radius: 8px;
          max-width: 500px;
          box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .post h2 {
          margin-bottom: 10px;
          color: #222;
        }

        .post p {
          color: #555;
        }
    </style>
</head>
<body>
<h1>[간단한 게시판]</h1>

<div class="board-form">
    <input type="text" id="title" placeholder="제목을 입력하세요" />
    <textarea id="content" placeholder="내용을 입력하세요" rows="5"></textarea>
    <button onclick="addPost()">게시하기</button>
</div>

<div id="postList"></div>

<script>
    function addPost() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();

      if (!title || !content) {
        alert("제목과 내용을 모두 입력해 주세요.");
        return;
      }

      const postList = document.getElementById("postList");

      const post = document.createElement("div");
      post.className = "post";

      const postTitle = document.createElement("h2");
      postTitle.textContent = title;

      const postContent = document.createElement("p");
      postContent.textContent = content;

      post.appendChild(postTitle);
      post.appendChild(postContent);

      postList.prepend(post); // 최근 글이 위에 오도록

      // 입력창 초기화
      document.getElementById("title").value = "";
      document.getElementById("content").value = "";
    }
</script>
</body>
</html>

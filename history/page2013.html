<h2>한국수출입은행</h2>
<pre>
13.04 – 14.03 (SM)

한국수출입은행 내부 시스템에서 예산, 자산, 일반관리 업무를 운영
- EJB를 이용하여 JAVA, jsp로 개발 운영함
- 운영 중 소프트웨어 업데이트 (오라클 버전 업, 자바 버전 업)
  문제가 없던 화면들에서 기존 기술을 사용 할수 없게 되면서 에러 남
  역시나 SM이였으나 야근함
- 자바 1.5 버전 업이 되면서 오라클 데디터 타입 clob를 사용하는 스타일이 바뀜
  기존에는 java streem으로 처리 했는데 1.5에서는 string 타입으로 사용해도 무방함

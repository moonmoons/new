<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
     * {
          box-sizing: border-box;
        }

       .main_body {
          background: linear-gradient(120deg, #d4fc79, #96e6a1);
          color: #333;
          overflow-x: hidden;
        }
       .hero {
                height: 50vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 2rem;
              }

       .hero h1 {
                font-size: 2.5rem;
              }

       .typing {
                font-size: 1.3rem;
                color: #222;
                margin-top: 1rem;
                border-right: 2px solid #222;
                white-space: nowrap;
                overflow: hidden;
                width: 0;
                animation: typing 10s steps(100, end) forwards;
              }

       @keyframes typing {
                from { width: 0; }
                to { width: 100%; }
              }

       .cards {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                padding: 2rem;
                gap: 1rem;
              }

       .card {
                background: white;
                border-radius: 1rem;
                padding: 1.5rem;
                box-shadow: 0 8px 16px rgba(0,0,0,0.1);
                max-width: 250px;
                opacity: 1;
                transform: translateY(20px);
                transition: all 0.6s ease;
              }

       .card.show {
                opacity: 1;
                transform: translateY(0);
              }

    </style>
    <script type="application/javascript">
    	const lines = [
    		 "10년 이상 Java 기반 웹 어플리케이션 개발 경력"
            ,"금융, 공공기관, 유통, 커머스, 카드사 등 다양한 도메인 경험"
            ,"Spring, Spring Boot, EJB, Oracle ADF 등 주요 프레임워크 활용 능숙"
            ,"RESTful API, ETL, 배치 개발, 하이브리드 웹, 표준/접근성 등 실무 경험 풍부"
            ,"Jira, Confluence, Git, SVN, AWS 등 협업/운영 환경 경험"    	
            ];
    	
    	let index = 0;

    	function showNextLine() {
    		
    	    if (index < lines.length) {
    	      $('#output').append(lines[index]+"</br>");
    	    	  
    	      index++;
    	      setTimeout(showNextLine, 1000); // 1초마다 다음 줄 출력
    	    }
    	}
    	showNextLine();
    	
    </script>
</head>

<section class="hero">
    <h1>안녕하세요. 반갑습니다.</h1>
    <div class="" id="output"></div>
</section>

<section class="cards">
    <div class="card"> Backend:</br>Java, JSP, Spring, Spring Boot, EJB, Oracle ADF, Shell Script, .RESTful API</div>
    <div class="card"> Frontend:</br>JavaScript, jQuery, HTML5, Thymeleaf, Websquare, TrustForm</div>
    <div class="card"> Database:</br>Oracle, MySQL, Tibero, MSSQL</div>
    <div class="card"> Tool/Infra:</br>Git, SVN, Jira, Confluence, AWS EC2, Clip Report, PowerBuilder</div>
</section>

<script>
    // 스크롤 시 카드 등장
    const cards = document.querySelectorAll('.card');
    window.addEventListener('scroll', () => {
      const trigger = window.innerHeight * 2.0;
      cards.forEach(card => {
        const cardTop = card.getBoundingClientRect().top;
        if (cardTop < trigger) {
          card.classList.add('show');
        }
      });
    });
</script>
